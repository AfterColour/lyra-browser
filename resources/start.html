<!doctype html>
<!--
  Lyra's start page: widgets on a wallpaper, arranged by the user (and the private tab page with
  ?private=1). Lyra opens it as file:///<Lyra folder>/resources/start.html?language=..&themeMode=..
  and hands it (browser/StartPage.cpp, browser/Wallpaper.cpp):
    cfg     the layout and widget settings, as saved before (lyra://start-save?cfg=<json>)
    favs    the bookmarks in Favorites; top: the most visited sites; icons: cached site icons
    wpdir   the folder with the wallpaper pictures: custom=<file> (the user's), bing=1 (picture
            of the day) with bingInfo / bingLink; picked=1 right after a picture was chosen
  Other lyra:// links: bookmarks-add/remove (Favorites), favicons, go?q= (search),
  start-wallpaper-file (file dialog).
-->
<html>
<head>
<meta charset="utf-8">
<script>
// Colours before the first paint, so a new tab never flashes white.
(function () {
  var q = new URLSearchParams(location.search), t = +(q.get("themeMode") || 0);
  var d = t === 2 || (t === 0 && q.get("sysdark") === "1");
  document.documentElement.dataset.theme = d ? "dark" : "light";
  document.documentElement.style.colorScheme = d ? "dark" : "light";
  var wp = "night";
  try { var c = JSON.parse(q.get("cfg") || "{}"); if (c.wallpaper && c.wallpaper.kind === "builtin") wp = c.wallpaper.id; else if (c.wallpaper) wp = ""; } catch (e) {}
  var bg = { night: "#141032", aurora: "#071a24", dusk: "#2b1b4f", ocean: "#04121f", morning: "#fbf3ea" }[wp];
  document.documentElement.style.background = q.get("private") === "1" ? (d ? "#18191C" : "#FAFBFC") : (bg || (d ? "#18191C" : "#F2F3F5"));
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  :root {
    --priv: #8A4FBF;
    --page: #FAFBFC; --card: #FFFFFF; --border: #E2E5EA; --text: #1B1D21; --text2: #59606B;
    --hover: rgba(0,0,0,.05); --field: #FFFFFF; --accent: #0067C0; --shadow: 0 1px 3px rgba(0,0,0,.06);
    --a1: #9E80FF; --a2: #6A4CE0; --gold: #FFD68C; --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.3, 1.3, .5, 1);   /* a small overshoot: things land, not stop */
  }
  :root[data-theme="dark"] {
    --page: #18191C; --card: #25272C; --border: #34373E; --text: #ECEDEF; --text2: #A6ABB4;
    --hover: rgba(255,255,255,.06); --field: #2E3036; --shadow: 0 0 0 transparent;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { color: var(--text); font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         -webkit-user-select: none; user-select: none; overflow-x: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
  input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
  .hidden { display: none !important; }

  /* ---- wallpaper ------------------------------------------------------------------- */
  /* absolute, not fixed: a full-window fixed layer shows a thin line where its tiles meet */
  #wall, #stars { position: absolute; left: 0; top: 0; width: 100%; min-height: 100%; height: var(--page-h, 100%); }
  /* The dim is painted into the wallpaper itself: a separate translucent overlay layer shows thin
     light lines where its tiles meet. */
  #wall { z-index: 0; --dim: 0;
          background-image: linear-gradient(rgba(0,0,0,var(--dim)), rgba(0,0,0,var(--dim))), var(--wp, none);
          background-size: cover; background-position: center top; background-repeat: no-repeat; }
  #stars { z-index: 0; pointer-events: none; overflow: hidden; }
  #stars canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .wp-night   { --wp: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(120,90,230,.30), transparent 70%), linear-gradient(160deg, #141032, #2C1A58); }
  .wp-aurora  { --wp: radial-gradient(ellipse 60% 45% at 18% 0%, rgba(60,220,160,.42), transparent 70%),
                            radial-gradient(ellipse 55% 50% at 85% 15%, rgba(120,90,255,.45), transparent 70%),
                            linear-gradient(180deg, #071a24, #0b0f2a); }
  .wp-dusk    { --wp: linear-gradient(180deg, #2b1b4f 0%, #5d2b68 42%, #c45f62 78%, #f0a874 100%); }
  .wp-ocean   { --wp: radial-gradient(ellipse 80% 50% at 50% 115%, rgba(40,140,200,.75), transparent 70%), linear-gradient(180deg, #04121f, #0a2a45); }
  .wp-morning { --wp: radial-gradient(ellipse 60% 50% at 80% 0%, rgba(255,214,170,.7), transparent 70%), linear-gradient(160deg, #fdf6ec, #f3e3f1 50%, #dfe9fb); }
  .wp-plain   { --wp: linear-gradient(var(--page), var(--page)); }
  .walls button[class^="wp-"] { background-image: var(--wp); }
  .credit { position: fixed; left: 16px; bottom: 14px; z-index: 2; max-width: 46vw; font-size: 11.5px; color: rgba(255,255,255,.72);
            text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .credit:hover { color: #fff; }

  /* ---- widgets on a 12-column grid ------------------------------------------------------- */
  /* tone: the wallpaper decides whether the glass is dark (light text) or light (dark text) */
  body { --g-bg: rgba(20, 16, 44, .42); --g-line: rgba(255,255,255,.10); --g-text: #F4F2FF; --g-text2: rgba(236,232,255,.66);
         --g-hover: rgba(255,255,255,.08); --g-field: rgba(255,255,255,.08); }
  body.tone-light { --g-bg: rgba(255,255,255,.62); --g-line: rgba(0,0,0,.08); --g-text: #1B1D21; --g-text2: #5A6070;
                    --g-hover: rgba(0,0,0,.05); --g-field: rgba(0,0,0,.05); }
  #board { position: relative; z-index: 1; transform-origin: 0 0; transition: transform .55s var(--ease); }
  .w { position: absolute; border-radius: 20px; color: var(--g-text); background: var(--g-bg);
       box-shadow: inset 0 0 0 1px var(--g-line), 0 18px 40px -24px rgba(0,0,0,.6);
       -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
       left: 0; top: 0;   /* the position is `translate` (cheap to animate), set by place() */
       transition: translate .5s var(--spring), width .35s var(--ease), height .35s var(--ease), opacity .35s var(--ease),
                   transform .35s var(--spring), box-shadow .3s var(--ease);
       display: flex; flex-direction: column; overflow: hidden; }
  .w.bare { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .w.enter { opacity: 0; transform: scale(.92); }
  .w .body { flex: 1; min-height: 0; padding: 16px 18px; display: flex; flex-direction: column; }
  .w h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--g-text2); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .w h2 .grow { flex: 1; }
  .w h2 a { color: var(--g-text2); font-weight: 400; text-decoration: none; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
  .w h2 a:hover { color: var(--g-text); background: var(--g-hover); }

  /* clock */
  .clock { align-items: center; justify-content: center; text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
  .clock .time { font: 200 calc(var(--h) * .42) / 1 "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; letter-spacing: -.02em; }
  .clock .date { margin-top: calc(var(--h) * .05); font-size: max(13px, calc(var(--h) * .075)); color: var(--g-text2); }
  body.tone-light .clock { text-shadow: none; }

  /* search */
  .search .body { padding: 0; justify-content: center; }
  .search form { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 18px; }
  .search svg { width: 18px; height: 18px; color: var(--g-text2); flex: none; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; font-size: 15px; }
  .search input::placeholder { color: var(--g-text2); }

  /* favorites */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px 6px; overflow: auto; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 6px 0; border-radius: 12px;
          text-decoration: none; color: var(--g-text); outline: none; }
  .tile .icon { width: 52px; height: 52px; border-radius: 14px; background: var(--g-field); box-shadow: inset 0 0 0 1px var(--g-line);
                display: flex; align-items: center; justify-content: center; transition: transform .25s var(--ease), background .25s; }
  .tile:hover .icon { transform: translateY(-2px); background: var(--g-hover); }
  .tile:focus-visible .icon { box-shadow: 0 0 0 2px var(--a1); }
  .badge { width: 28px; height: 28px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .tile .name { font-size: 12px; max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .remove { position: absolute; top: 0; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--g-bg);
                  box-shadow: inset 0 0 0 1px var(--g-line); font-size: 11px; opacity: 0; transition: opacity .15s; }
  .tile:hover .remove { opacity: 1; }
  .tile.add .icon { background: transparent; box-shadow: inset 0 0 0 1px var(--g-line); color: var(--g-text2); font-size: 24px; font-weight: 300; }

  /* frequently visited */
  .rows { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
  .row-link { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; text-decoration: none; color: var(--g-text); }
  .row-link:hover { background: var(--g-hover); }
  .row-link .badge { width: 24px; height: 24px; border-radius: 7px; font-size: 12px; flex: none; }
  .row-link .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-link .h { color: var(--g-text2); font-size: 12px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--g-text2); }

  /* weather */
  .weather .now { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .weather .now > div { min-width: 0; }
  .weather .now svg { width: 52px; height: 52px; flex: none; }
  .weather .city { font-size: 13px; font-weight: 600; color: var(--g-text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .weather .temp { font: 200 44px/1 "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; }
  .weather .what { color: var(--g-text2); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weather .days { margin-top: auto; display: flex; flex-wrap: wrap; gap: 24px 6px; padding-top: 10px; height: 40px; overflow: hidden; }
  .weather .day { flex: 1 0 70px; height: 30px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 5px;
                  padding: 6px 4px; border-radius: 10px; background: var(--g-field); font-size: 12px; white-space: nowrap; }
  .weather .day svg { width: 18px; height: 18px; flex: none; }
  .weather .day i { font-style: normal; }
  .weather .day .min { display: none; }
  .weather.tall .days { height: 86px; }
  .weather.tall .day { flex-direction: column; gap: 4px; padding: 8px 4px; border-radius: 12px; height: 76px; }
  .weather.tall .day svg { width: 22px; height: 22px; }
  .weather.tall .day .min { display: inline; }
  .weather .day b { font-weight: 600; }
  .weather .day span { color: var(--g-text2); }
  .weather .empty { margin: auto; text-align: center; color: var(--g-text2); }
  .weather .empty button { margin-top: 10px; }

  /* notes and to-do */
  .notes textarea { flex: 1; width: 100%; resize: none; border: 0; outline: none; background: none; font-size: 14px; line-height: 1.55; }
  .notes textarea::placeholder, .todo input::placeholder { color: var(--g-text2); }
  .todo ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .todo li { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; }
  .todo li:hover { background: var(--g-hover); }
  .todo li .chk { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--g-text2); flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: background .2s; }
  .todo li.done .chk { background: var(--a1); box-shadow: none; color: #fff; }
  .todo li.done .txt { color: var(--g-text2); text-decoration: line-through; }
  .todo li .txt { flex: 1; min-width: 0; word-break: break-word; }
  .todo li .del { opacity: 0; color: var(--g-text2); font-size: 12px; width: 20px; }
  .todo li:hover .del { opacity: 1; }
  .todo form { margin-top: 8px; }
  .todo input { width: 100%; height: 34px; border: 0; outline: none; border-radius: 10px; padding: 0 12px; background: var(--g-field); }

  .pill { height: 30px; padding: 0 14px; border-radius: 999px; background: var(--g-field); box-shadow: inset 0 0 0 1px var(--g-line); font-size: 12.5px; }
  .pill:hover { background: var(--g-hover); }

  /* ---- editing ----------------------------------------------------------------------- */
  #board::before { content: ""; position: absolute; inset: 0 -8px; border-radius: 12px; pointer-events: none; opacity: 0; transition: opacity .45s var(--ease);
                                background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 calc(var(--cw) - 16px), transparent calc(var(--cw) - 16px) var(--cw)); }
  body.editing #board::before { opacity: 1; }
  body.tone-light #board::before { background: repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 calc(var(--cw) - 16px), transparent calc(var(--cw) - 16px) var(--cw)); }
  body.editing .w { cursor: grab; box-shadow: inset 0 0 0 1px var(--g-line), 0 0 0 1px rgba(158,128,255,.35), 0 18px 40px -24px rgba(0,0,0,.6); }
  body.editing .w.bare { background: rgba(255,255,255,.04); }
  body.editing .w .body { pointer-events: none; }
  body.editing .w.dragging { cursor: grabbing; z-index: 5; transition: transform .3s var(--spring), box-shadow .3s var(--ease), opacity .35s;
                             box-shadow: inset 0 0 0 1px var(--g-line), 0 0 0 2px var(--a1), 0 30px 60px -20px rgba(0,0,0,.7); }
  body.editing .w.lift { transform: scale(1.035); box-shadow: inset 0 0 0 1px var(--g-line), 0 0 0 2px var(--a1), 0 40px 70px -24px rgba(0,0,0,.75); }
  body.editing .w.landing { z-index: 4; }
  .w .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; opacity: 0; transform: scale(.7); pointer-events: none;
              transition: opacity .25s var(--ease), transform .35s var(--spring); }
  body.editing .w .tools { opacity: 1; transform: none; pointer-events: auto; }
  body.editing .w.dragging .tools, body.editing .w.dragging .grip { opacity: 0; }
  .w .tools button { width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .w .tools button:hover { background: rgba(0,0,0,.7); }
  .w .grip { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; cursor: nwse-resize; z-index: 2;
             opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
  .w .grip::before { content: ""; position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-right: 2px solid var(--g-text2); border-bottom: 2px solid var(--g-text2); border-radius: 0 0 3px 0; }
  body.editing .w .grip { opacity: 1; pointer-events: auto; }
  .ghost { position: absolute; left: 0; top: 0; border-radius: 20px; background: rgba(158,128,255,.14); box-shadow: inset 0 0 0 2px rgba(158,128,255,.55);
           pointer-events: none; z-index: 0; transition: translate .22s var(--ease), width .22s var(--ease), height .22s var(--ease), opacity .2s;
           animation: ghostIn .25s var(--ease); }
  .ghost.gone { opacity: 0; }
  @keyframes ghostIn { from { opacity: 0; transform: scale(.96); } }

  .corner { position: fixed; right: 18px; bottom: 14px; z-index: 3; height: 34px; padding: 0 14px; border-radius: 999px;
            display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--g-text); background: var(--g-bg);
            box-shadow: inset 0 0 0 1px var(--g-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            opacity: .75; transition: opacity .25s, transform .25s var(--ease); }
  .corner:hover { opacity: 1; transform: translateY(-1px); }
  .corner svg { width: 14px; height: 14px; }
  body.editing .corner { opacity: 0; pointer-events: none; }

  /* the panel on the right while editing */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 6; display: flex; flex-direction: column;
           background: rgba(22, 20, 38, .95); color: #F4F2FF;
           box-shadow: -1px 0 0 rgba(255,255,255,.08), -20px 0 60px -20px rgba(0,0,0,.6);
           transform: translateX(105%); transition: transform .45s var(--ease); }
  body.editing #panel { transform: none; }
  #panel header { padding: 20px 20px 12px; }
  #panel h3 { margin: 0 0 14px; font: 300 22px/1.2 "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; }
  .tabs, .seg { position: relative; display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.06); }
  .tabs::before, .seg::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 5px); border-radius: 999px;
                                background: rgba(255,255,255,.12); transition: left .45s var(--spring); }
  .tabs.second::before, .seg.second::before { left: calc(50% + 1px); }
  .tabs button, .seg button { position: relative; flex: 1; height: 30px; border-radius: 999px; color: rgba(236,232,255,.66); font-size: 13px; transition: background .25s, color .25s; }
  .tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { color: #fff; }
  .seg button { height: 28px; font-size: 12.5px; }
  .layout { padding: 6px 0 14px; margin-bottom: 8px; box-shadow: 0 1px 0 rgba(255,255,255,.07); }
  .layout .cap { font-size: 12px; color: rgba(236,232,255,.6); margin: 0 0 8px; }
  .layout .hint { font-size: 12px; color: rgba(236,232,255,.55); margin: 8px 2px 0; min-height: 17px; transition: opacity .2s; }
  #panel .scroll > div:not(.hidden) { animation: tabIn .4s var(--ease); }
  @keyframes tabIn { from { margin-top: 8px; color: transparent; } }
  #panel .scroll { flex: 1; overflow: auto; padding: 8px 20px 20px; }
  .wlist button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; text-align: left; transition: background .2s; }
  .wlist button:hover { background: rgba(255,255,255,.06); }
  .wlist button:disabled { opacity: .4; cursor: default; background: none; }
  .wlist .ic { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, rgba(158,128,255,.35), rgba(106,76,224,.35)); display: flex; align-items: center; justify-content: center; flex: none; }
  .wlist .ic svg { width: 20px; height: 20px; }
  .wlist b { display: block; font-size: 13.5px; font-weight: 600; }
  .wlist span.d { font-size: 12px; color: rgba(236,232,255,.6); }
  .wlist .plus { margin-left: auto; color: rgba(236,232,255,.6); font-size: 18px; }
  .walls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .walls button { position: relative; height: 84px; border-radius: 14px; overflow: hidden; background-size: cover; background-position: center;
                  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); top: 0; transition: top .25s var(--ease), box-shadow .25s; }
  .walls button:hover { top: -2px; }
  .walls button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--a1), 0 10px 26px -12px rgba(140,110,255,.9); }
  .walls button span { position: absolute; left: 8px; bottom: 6px; font-size: 11.5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .walls button.wp-morning span { color: #2a2440; text-shadow: none; }
  .walls .file { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.05); color: rgba(236,232,255,.7); font-size: 22px; }
  .walls .file svg { width: 26px; height: 26px; margin-top: -10px; }
  .slider { margin-top: 18px; }
  .slider label { display: flex; justify-content: space-between; font-size: 12.5px; color: rgba(236,232,255,.7); margin-bottom: 6px; }
  .slider input { width: 100%; accent-color: var(--a1); }
  #panel footer { padding: 14px 20px 18px; display: flex; gap: 10px; box-shadow: 0 -1px 0 rgba(255,255,255,.08); }
  #panel footer button { height: 38px; border-radius: 999px; padding: 0 16px; font-size: 13px; }
  #panel footer .reset { color: rgba(236,232,255,.66); }
  #panel footer .reset:hover { color: #fff; }
  #panel footer .done { margin-left: auto; padding: 0 26px; color: #fff; font-weight: 600; background: linear-gradient(135deg, var(--a1), var(--a2)); }

  /* small cards: widget settings, add a favorite */
  .pop { position: fixed; z-index: 8; width: 300px; padding: 16px; border-radius: 16px; background: rgba(28, 26, 46, .97); color: #F4F2FF;
         box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 24px 60px -16px rgba(0,0,0,.7); }
  .pop h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .pop input[type=text] { width: 100%; height: 34px; border-radius: 10px; border: 0; outline: none; padding: 0 12px; background: rgba(255,255,255,.08); }
  .pop input[type=text]::placeholder { color: rgba(236,232,255,.45); }
  .pop .opts { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow: auto; }
  .pop .opts button { text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .pop .opts button:hover { background: rgba(255,255,255,.08); }
  .pop .opts small { color: rgba(236,232,255,.55); }
  .pop label.chk { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; cursor: pointer; }
  .pop label.chk input { accent-color: var(--a1); width: 16px; height: 16px; margin: 0; }

    node.removeEventListener("pointermove", move);
    node.removeEventListener("pointerup", up);
    node.removeEventListener("pointercancel", up);
    if (held) land(w, node);
  };
  node.addEventListener("pointermove", move);
  node.addEventListener("pointerup", up);
  node.addEventListener("pointercancel", up);
}
function startResize(e, w, node) {
  if (!editing || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const k = KINDS[w.type];
  const sx = e.clientX, sy = e.clientY, sw = w.w, sh = w.h;
  const grip = e.currentTarget;
  grip.setPointerCapture(e.pointerId);
  node.classList.add("dragging");
  document.body.classList.add("dragging");
  let lw = sw, lh = sh;
  pending = null;
  showGhost(w);
  const move = (ev) => {
    const dx = (ev.clientX - sx) / boardScale, dy = (ev.clientY - sy) / boardScale;
    node.style.width = Math.max(60, sw * cw - GAP + dx) + "px";
    node.style.height = Math.max(40, sh * ROW - GAP + dy) + "px";
    let tw = clamp(Math.round(sw + dx / cw), k.minW, COLS - w.x), th = clamp(Math.round(sh + dy / ROW), k.minH, k.maxH);
    if (freeMode()) {           // free layout: grow only into empty space, as far as it goes
      const fits = (ww, hh) => !cfg.widgets.some((o) => o !== w && overlaps({ x: w.x, y: w.y, w: ww, h: hh }, o));
      if (!fits(tw, th)) { if (fits(tw, lh)) th = lh; else if (fits(lw, th)) tw = lw; else { tw = lw; th = lh; } }
    }
    if (tw === lw && th === lh && pending) return;
    lw = tw; lh = th;
    const t = { x: w.x, y: w.y, w: tw, h: th };
    if (freeMode()) { pending = new Map([[w, t]]); showGhost(t); }
    else aim(w, t, node);
  };
  const up = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", up);
    grip.removeEventListener("pointercancel", up);
    const changed = pending && pending.get(w) && (pending.get(w).w !== sw || pending.get(w).h !== sh);
    land(w, node);
    if (changed) fill(w, node);
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
  grip.addEventListener("pointercancel", up);
}
function addWidget(type) {
  const k = KINDS[type];
  const spot = freeSpot(k.w, k.h);
  const w = { id: k.single ? type : newId(type), type, x: spot.x, y: spot.y, w: k.w, h: k.h };
  cfg.widgets.push(w);
  render(true); renderPanel(); save();
  const node = nodes.get(w.id);
  if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
  if (type === "weather") setTimeout(() => openSettings(w, nodes.get(w.id)), 450);
}
function removeWidget(w) {
  const node = nodes.get(w.id);
  cfg.widgets = cfg.widgets.filter((x) => x !== w);
  delete cfg.data[w.id];
  if (node) node.classList.add("enter");
  setTimeout(() => { if (!freeMode()) compact(); render(); }, 320);
  renderPanel(); save();
}

// the panel
let panelTab = "widgets";
function renderPanel() {
  const s = t();
  $("panelTitle").textContent = s.panelTitle;
  $("tabWidgets").textContent = s.tabWidgets; $("tabWalls").textContent = s.tabWalls;
  $("reset").textContent = s.reset; $("done").textContent = s.done;
  $("dimLabel").textContent = s.dim;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === panelTab)));
  $("widgetsTab").classList.toggle("hidden", panelTab !== "widgets");
  document.querySelector(".tabs").classList.toggle("second", panelTab === "walls");
  $("layoutCap").textContent = s.layout;
  $("layoutAuto").textContent = s.layoutAuto; $("layoutFree").textContent = s.layoutFree;
  $("layoutSeg").classList.toggle("second", freeMode());
  $("layoutAuto").setAttribute("aria-pressed", String(!freeMode()));
  $("layoutFree").setAttribute("aria-pressed", String(freeMode()));
  $("layoutHint").textContent = freeMode() ? s.layoutHintFree : s.layoutHintAuto;
  $("wallsTab").classList.toggle("hidden", panelTab !== "walls");
  const list = $("wlist");
  list.textContent = "";
  for (const type of Object.keys(KINDS)) {
    const has = cfg.widgets.some((w) => w.type === type);
    const b = el("button", "", '<span class="ic">' + svg(ICON[type]) + '</span><span><b></b><span class="d"></span></span><span class="plus">+</span>');
    b.querySelector("b").textContent = s.widgets[type][0];
    b.querySelector(".d").textContent = s.widgets[type][1];
    b.disabled = KINDS[type].single && has;
    b.addEventListener("click", () => addWidget(type));
    list.appendChild(b);
  }
  const walls = $("walls");
  walls.textContent = "";
  const wp = cfg.wallpaper;
  const pick = (kind, id) => {
    cfg.wallpaper = { kind, id, dim: wp.dim || 0 };
    applyWallpaper(); renderPanel(); save(true);
  };
  for (const id of Object.keys(BUILTIN)) {
    const b = el("button", "wp-" + id, "<span></span>");
    b.querySelector("span").textContent = s.walls[id];
    b.setAttribute("aria-pressed", String(wp.kind === "builtin" && wp.id === id));
    b.addEventListener("click", () => pick("builtin", id));
    walls.appendChild(b);
  }
  const imageIcon = svg('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/>');
  const bing = el("button", bingUrl() ? "" : "file", (bingUrl() ? "" : imageIcon) + "<span></span>");
  if (bingUrl()) bing.style.backgroundImage = "url('" + bingUrl() + "')";
  bing.querySelector("span").textContent = s.walls.bing;
  bing.setAttribute("aria-pressed", String(wp.kind === "bing"));
  bing.addEventListener("click", () => pick("bing"));
  walls.appendChild(bing);
  const file = el("button", customUrl() ? "" : "file", (customUrl() ? "" : "+") + "<span></span>");
  if (customUrl()) file.style.backgroundImage = "url('" + customUrl() + "')";
  file.querySelector("span").textContent = s.walls.file;
  file.setAttribute("aria-pressed", String(wp.kind === "file"));
  file.addEventListener("click", () => {
    if (customUrl() && wp.kind !== "file") { pick("file"); return; }
    save(true);
    setTimeout(() => { location.href = "lyra://start-wallpaper-file"; }, 60);     // Lyra's file dialog
  });
  walls.appendChild(file);
  for (const theme of THEMES) {
    const th = el("button", "", "<span></span>");
    th.style.backgroundImage = "url('" + themeUrl(theme.id) + "')";
    th.querySelector("span").textContent = theme.n || s.walls.theme;
    th.setAttribute("aria-pressed", String(wp.kind === "theme" && wp.id === theme.id));
    th.addEventListener("click", () => pick("theme", theme.id));
    walls.appendChild(th);
  }
  $("dim").value = wp.dim || 0;
  $("dimValue").textContent = (wp.dim || 0) + "%";
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { panelTab = b.dataset.tab; renderPanel(); }));
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  const mode = b.dataset.mode;
  if ((mode === "free") === freeMode()) return;
  cfg.layout = mode;
  if (mode === "auto") { settle(null); compact(); render(); }   // back to automatic: close the gaps
  renderPanel(); save();
}));
$("dim").addEventListener("input", () => { cfg.wallpaper.dim = +$("dim").value; $("dimValue").textContent = cfg.wallpaper.dim + "%"; applyWallpaper(); save(); });
$("done").addEventListener("click", () => setEditing(false));
$("reset").addEventListener("click", () => {
  if (!confirm(t().resetAsk)) return;
  cfg = defaultConfig();
  for (const node of nodes.values()) node.remove();
  nodes.clear();
  applyWallpaper(); render(true); renderPanel(); save(true);
});
$("customize").addEventListener("click", () => setEditing(true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("pop")) closePop(); else if (editing) setEditing(false); } });

// ---- small cards: widget settings and "add to Favorites" ------------------------------------
function closePop() { const p = $("pop"); if (p) p.remove(); const s = $("popScrim"); if (s) s.remove(); }
function openPop(near, build) {
  closePop();
  const scrim = el("div", "scrim"); scrim.id = "popScrim"; scrim.addEventListener("click", closePop);
  const pop = el("div", "pop"); pop.id = "pop";
  build(pop);
  document.body.append(scrim, pop);
  const r = near ? near.getBoundingClientRect() : { left: innerWidth / 2 - 150, top: innerHeight / 3, width: 300, bottom: innerHeight / 3 };
  const x = Math.max(12, Math.min(innerWidth - 312, r.left + r.width / 2 - 150));
  const y = Math.min(innerHeight - pop.offsetHeight - 12, r.bottom + 8);
  pop.style.left = x + "px"; pop.style.top = Math.max(12, y) + "px";
  const first = pop.querySelector("input[type=text]"); if (first) first.focus();
}
function openSettings(w, node) {
  const s = t();
  if (w.type === "clock") {
    openPop(node, (pop) => {
      pop.innerHTML = "<h4></h4><label class='chk'><input type='checkbox' id='oSec'><span></span></label><label class='chk'><input type='checkbox' id='oDate'><span></span></label>";
      pop.querySelector("h4").textContent = s.widgets.clock[0];
      const spans = pop.querySelectorAll("label span"); spans[0].textContent = s.seconds; spans[1].textContent = s.greeting;
      const opt = w.opt = w.opt || {};
      pop.querySelector("#oSec").checked = !!opt.seconds; pop.querySelector("#oDate").checked = opt.date !== false;
      pop.querySelector("#oSec").addEventListener("change", (e) => { opt.seconds = e.target.checked; fill(w, node); save(); });
      pop.querySelector("#oDate").addEventListener("change", (e) => { opt.date = e.target.checked; fill(w, node); save(); });
    });
    return;
  }
  openPop(node, (pop) => {   // weather: find a city
    pop.innerHTML = "<h4></h4><input type='text' autocomplete='off'><div class='opts'></div>";
    pop.querySelector("h4").textContent = s.chooseCity;
    const input = pop.querySelector("input"), opts = pop.querySelector(".opts");
    input.placeholder = s.cityPh;
    let timer = 0;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      const name = input.value.trim();
      if (name.length < 2) { opts.textContent = ""; return; }
      timer = setTimeout(() => {
        fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=" + (ru() ? "ru" : "en") + "&name=" + encodeURIComponent(name))
          .then((r) => r.json()).then((j) => {
            opts.textContent = "";
            for (const c of (j.results || [])) {
              const b = el("button", "", "<span></span> <small></small>");
              b.firstChild.textContent = c.name;
              b.lastChild.textContent = [c.admin1, c.country].filter(Boolean).join(", ");
              b.addEventListener("click", () => {
                w.opt = { city: c.name, lat: c.latitude, lon: c.longitude };
                delete cfg.data[w.id];
                closePop(); fill(w, node); save();
              });
              opts.appendChild(b);
            }
          }).catch(() => {});
      }, 300);
    });
  });
}
function openAddFavorite() {
  const s = t();
  openPop(null, (pop) => {
    pop.innerHTML = "<h4></h4><input type='text' id='fUrl' placeholder='example.com'><div style='height:8px'></div><input type='text' id='fName'>" +
                    "<div class='row'><button id='fCancel'></button><button class='primary' id='fOk'></button></div>";
    pop.querySelector("h4").textContent = s.addTitle;
    pop.querySelector("#fName").placeholder = s.name;
    pop.querySelector("#fCancel").textContent = s.cancel; pop.querySelector("#fOk").textContent = s.add;
    pop.querySelector("#fCancel").addEventListener("click", closePop);
    const ok = () => {
      let url = pop.querySelector("#fUrl").value.trim();
      if (!url) { pop.querySelector("#fUrl").focus(); return; }
      if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
      const name = pop.querySelector("#fName").value.trim() || hostOf(url);
      closePop();
      bookmarks("add", { folder: 1, t: name, u: url });       // Lyra reloads the page with it
    };
    pop.querySelector("#fOk").addEventListener("click", ok);
    pop.addEventListener("keydown", (e) => { if (e.key === "Enter") ok(); });
  });
}

// ---- private tab ------------------------------------------------------------------------------
function renderPrivate() {
  const s = t();
  document.title = s.pTab;
  document.body.classList.add("private-page");
  for (const id of ["pTitle", "pLead", "pForgets", "pShows", "pHint"]) $(id).textContent = s[id];
  for (const id of ["pForgetsList", "pShowsList"]) {
    const ul = $(id);
    ul.textContent = "";
    for (const html of s[id]) ul.appendChild(el("li", "", html));
  }
}

// ---- smoothness log --------------------------------------------------------------------------
// Only with perf=1 in the address (Lyra adds it when started with LYRA_PAGE_PERF=1): while the user
// scrolls, moves the pointer or types (and 1.5 s after), the frames are timed; every few seconds a
// summary of the slow ones goes to tabs.log ("page frames"). Off otherwise: timing every frame keeps
// the page drawing at the display's full rate.
(() => {
  if (!new URLSearchParams(location.search).has("perf")) return;
  let raf = 0, last = 0, until = 0, cause = "", frames = 0, slow = 0, worst = 0, causes = {};
  const tick = (t) => {
    if (last) {
      const d = t - last;
      frames++;
      if (d > 25) { slow++; worst = Math.max(worst, d); causes[cause] = (causes[cause] || 0) + 1; }
    }
    last = t;
    if (performance.now() < until && !document.hidden) raf = requestAnimationFrame(tick);
    else { raf = 0; last = 0; }
  };
  const poke = (e) => {
    cause = e.type;
    until = performance.now() + 1500;
    if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
  };
  ["pointermove", "pointerdown", "wheel", "keydown", "scroll", "input"].forEach((n) => addEventListener(n, poke, { passive: true, capture: true }));
  setInterval(() => {
    if (!slow) { frames = 0; return; }
    const by = Object.keys(causes).map((k) => k + ":" + causes[k]).join(" ");
    ((q) => { location.href = "lyra://perf?page=start&" + q; })("frames=" + frames + "&slow=" + slow + "&worst=" + Math.round(worst) + "&during=" + encodeURIComponent(by));
    frames = slow = worst = 0; causes = {};
  }, 5000);
})();

// ---- start ------------------------------------------------------------------------------------
document.documentElement.lang = ru() ? "ru" : "en";
if (q.get("private") === "1") {
  $("private").classList.remove("hidden");
  renderPrivate();
} else {
  document.title = t().newTab;
  $("customizeText").textContent = t().customize;
  for (const id of ["wall", "board", "customize"]) $(id).classList.remove("hidden");
  const picked = q.get("picked") === "1";
  if (picked) { cfg.wallpaper = { kind: "file", dim: cfg.wallpaper.dim || 0 }; save(true); }
  applyWallpaper();
  if (picked) { panelTab = "walls"; editing = true; document.body.classList.add("editing"); renderPanel(); }
  else if (q.get("edit") === "1") setTimeout(() => setEditing(true), 350);   // Settings > Start Page > Widgets
  render(true);
  addEventListener("resize", () => render());
}
