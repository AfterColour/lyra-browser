<!doctype html>
<!--
  Lyra reader view. Lyra fills it from the article Readability found and writes it to
  %LOCALAPPDATA%\Lyra\Reader\tab<id>-<n>.html. The page's own scripts never come along: the
  content arrives as JSON and the policy below lets only this page's script run.
-->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data: blob:; media-src *; style-src 'unsafe-inline'; font-src data:; script-src 'nonce-lyrareader'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root { --bg: #FFFFFF; --text: #1C1D20; --text2: #5D636D; --rule: #E3E5E9; --link: #0A5DC2; --bar: rgba(255,255,255,.92);
          --btn: #F1F2F4; --btnHover: #E6E8EB; --accent: #0067C0; --size: 19px; --width: 680px; --font: Georgia, "Cambria", "Times New Roman", serif; }
  :root[data-theme="sepia"] { --bg: #F4ECD8; --text: #4B3A26; --text2: #7A6650; --rule: #E2D5B9; --link: #8A4B12; --bar: rgba(244,236,216,.94); --btn: #EADFC4; --btnHover: #E0D2B2; }
  :root[data-theme="dark"] { --bg: #1C1C1F; --text: #E6E6E8; --text2: #A2A4AA; --rule: #33343A; --link: #7DB4FF; --bar: rgba(28,28,31,.92); --btn: #2B2C31; --btnHover: #36373D; }
  :root[data-font="sans"] { --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); }
  body { margin: 0; font: var(--size)/1.65 var(--font); -webkit-font-smoothing: antialiased; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 8px;
         padding: 10px 16px; background: var(--bar); backdrop-filter: blur(8px); border-bottom: 1px solid transparent;
         font: 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; transition: border-color .15s; }
  .bar.scrolled { border-bottom-color: var(--rule); }
  .bar button { height: 32px; min-width: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--btn); color: var(--text);
                font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .bar button:hover { background: var(--btnHover); }
  .panel { position: absolute; right: 16px; top: 50px; width: 300px; padding: 14px; border-radius: 12px; background: var(--bg);
           box-shadow: 0 0 0 1px var(--rule), 0 12px 32px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 12px; }
  .panel[hidden] { display: none; }
  .panel .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .panel .row button { width: 100%; padding: 0 6px; justify-content: center; }
  .panel .row button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent) inset; }
  .panel .label { font-size: 11px; color: var(--text2); margin-bottom: -6px; }
  .swatch { width: 100%; border: 1px solid var(--rule) !important; }
  main { max-width: var(--width); margin: 0 auto; padding: 28px 24px 120px; }
  .site { font: 600 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text2); text-transform: uppercase;
          letter-spacing: .04em; text-decoration: none; }
  h1.title { font-size: 1.75em; line-height: 1.22; margin: 10px 0 12px; font-weight: 700; }
  .meta { font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text2); padding-bottom: 20px;
          margin-bottom: 26px; border-bottom: 1px solid var(--rule); }
  article a { color: var(--link); }
  article img, article video, article svg, article figure { max-width: 100%; height: auto; }
  article figure { margin: 1.4em 0; }
  article figcaption, article .caption { font-size: .8em; color: var(--text2); margin-top: .4em; }
  article h2, article h3, article h4 { line-height: 1.3; margin: 1.6em 0 .6em; }
  article blockquote { margin: 1.2em 0; padding: 0 0 0 1em; border-left: 3px solid var(--rule); color: var(--text2); }
  article pre, article code { font-family: "Cascadia Mono", Consolas, monospace; font-size: .82em; }
  article pre { overflow: auto; padding: 12px 14px; border-radius: 8px; background: var(--btn); line-height: 1.45; }
  article table { border-collapse: collapse; display: block; overflow: auto; font-size: .85em; }
  article td, article th { border: 1px solid var(--rule); padding: 6px 8px; }
  article hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="close" title=""><span aria-hidden="true">&#10005;</span><span id="closeText"></span></button>
  <button id="aa" aria-haspopup="true"><span style="font-family: Georgia, serif; font-size: 15px">Aa</span></button>
  <div class="panel" id="panel" hidden>
    <div class="label" id="lSize"></div>
    <div class="row"><button id="smaller">A&minus;</button><button id="larger" style="font-size:15px">A+</button></div>
    <div class="label" id="lFont"></div>
    <div class="row" data-key="font"><button data-v="1" style="font-family:Georgia,serif" id="fSerif"></button><button data-v="0" id="fSans"></button></div>
    <div class="label" id="lTheme"></div>
    <div class="row" data-key="theme"><button data-v="0" id="tAuto"></button><button data-v="1" class="swatch" style="background:#fff;color:#1c1d20" id="tLight"></button><button data-v="2" class="swatch" style="background:#f4ecd8;color:#4b3a26" id="tSepia"></button><button data-v="3" class="swatch" style="background:#1c1c1f;color:#e6e6e8" id="tDark"></button></div>
    <div class="label" id="lWidth"></div>
    <div class="row" data-key="width"><button data-v="0" id="wNarrow"></button><button data-v="1" id="wNormal"></button><button data-v="2" id="wWide"></button></div>
  </div>
</div>
<main>
  <a class="site" id="site"></a>
  <h1 class="title" id="title"></h1>
  <div class="meta" id="meta"></div>
  <article id="content"></article>
</main>
<script type="application/json" id="article">%LYRA_ARTICLE%</script>
<script type="application/json" id="prefs">%LYRA_PREFS%</script>
<script nonce="lyrareader">
"use strict";
const A = JSON.parse(document.getElementById("article").textContent);
const P = JSON.parse(document.getElementById("prefs").textContent);
const ru = !!P.ru;
const T = ru ? {
  close: "Закрыть режим чтения", size: "Размер текста", font: "Шрифт", serif: "С засечками", sans: "Без засечек",
  theme: "Тема", auto: "Авто", light: "Светлая", sepia: "Сепия", dark: "Тёмная", width: "Ширина", narrow: "Узко", normal: "Обычно", wide: "Широко",
  min: (n) => n + " мин чтения",
} : {
  close: "Close reader view", size: "Text size", font: "Font", serif: "Serif", sans: "Sans", theme: "Theme", auto: "Auto",
  light: "Light", sepia: "Sepia", dark: "Dark", width: "Width", narrow: "Narrow", normal: "Normal", wide: "Wide",
  min: (n) => n + " min read",
};
const $ = (id) => document.getElementById(id);
const state = { size: P.size || 19, font: P.font ?? 1, theme: P.theme || 0, width: P.width ?? 1 };
const WIDTHS = ["600px", "680px", "820px"];

function apply() {
  const root = document.documentElement;
  const theme = state.theme === 0 ? (P.dark ? "dark" : "light") : ["", "light", "sepia", "dark"][state.theme];
  root.dataset.theme = theme;
  root.dataset.font = state.font ? "serif" : "sans";
  root.style.setProperty("--size", state.size + "px");
  root.style.setProperty("--width", WIDTHS[state.width] || WIDTHS[1]);
  if (/^[0-9a-fA-F]{6}$/.test(P.accent || "")) root.style.setProperty("--accent", "#" + P.accent);
  root.style.colorScheme = theme === "dark" ? "dark" : "light";
  document.querySelectorAll(".row[data-key]").forEach((row) => {
    row.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === state[row.dataset.key])));
  });
}
function save() {
  apply();
  location.href = "lyra://reader-prefs?size=" + state.size + "&font=" + state.font + "&theme=" + state.theme + "&width=" + state.width;
}

document.title = A.title || A.site || "";
document.documentElement.lang = A.lang || (ru ? "ru" : "en");
if (A.dir) document.documentElement.dir = A.dir;
$("title").textContent = A.title || "";
$("site").textContent = A.site || (A.url ? new URL(A.url).hostname.replace(/^www\./, "") : "");
if (A.url) $("site").href = A.url;
const minutes = Math.max(1, Math.round((A.length || 0) / 1100));
$("meta").textContent = [A.byline, T.min(minutes)].filter(Boolean).join(" · ");
$("content").innerHTML = A.content || "";
// Links open the original pages; relative ones were already made absolute by Readability.
$("content").querySelectorAll("a[href^='#']").forEach((a) => a.removeAttribute("href"));

$("closeText").textContent = T.close;
for (const [id, key] of [["lSize", "size"], ["lFont", "font"], ["fSerif", "serif"], ["fSans", "sans"], ["lTheme", "theme"], ["tAuto", "auto"],
                         ["tLight", "light"], ["tSepia", "sepia"], ["tDark", "dark"], ["lWidth", "width"], ["wNarrow", "narrow"],
                         ["wNormal", "normal"], ["wWide", "wide"]]) $(id).textContent = T[key];
$("close").addEventListener("click", () => { location.href = "lyra://reader-exit"; });
$("aa").addEventListener("click", (e) => { e.stopPropagation(); $("panel").hidden = !$("panel").hidden; });
$("panel").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => { $("panel").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("panel").hidden = true; });
$("smaller").addEventListener("click", () => { state.size = Math.max(14, state.size - 1); save(); });
$("larger").addEventListener("click", () => { state.size = Math.min(30, state.size + 1); save(); });
document.querySelectorAll(".row[data-key] button").forEach((b) => b.addEventListener("click", () => {
  state[b.parentElement.dataset.key] = +b.dataset.v; save();
}));
window.addEventListener("scroll", () => $("bar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
apply();
</script>
</body>
</html>
