<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Custom Controls Test — Diagnostics</title>
<style>
body{font-family:system-ui,sans-serif;margin:2em;background:#f5f5f5}
#wrap{background:#fff;padding:1em;border-radius:8px;max-width:720px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
h2{margin-top:0}
video{width:640px;height:360px;background:#222;display:block;border:2px solid #ccc;margin:8px 0}
button{padding:6px 12px;margin:4px 2px;cursor:pointer}
input[type=range]{width:200px;vertical-align:middle}
#diag{font-family:monospace;font-size:12px;background:#111;color:#0f0;padding:8px;border-radius:4px;white-space:pre-wrap;margin-top:8px}
#eventLog{font-family:monospace;font-size:11px;background:#222;color:#ddd;padding:8px;border-radius:4px;max-height:220px;overflow-y:auto;margin-top:8px}
.error{color:#f66}
</style>
</head>
<body>
<div id="wrap">
<h2>Custom Controls — lit.mkv (diagnostic)</h2>
<video id="v" width="640" height="360">
  <source src="file:///C:/Users/felix/Videos/lit.mkv" type="video/x-matroska">
</video>
<div>
  <button onclick="clickCount('Play'); try{ var p=v.play(); p.then(function(){updateDiag('play Promise resolved');},function(e){updateDiag('play Promise rejected: '+(e&&e.name?e.name+': ':'')+(e&&e.message?e.message:'unknown'))}); }catch(e){updateDiag('play exception: '+(e&&e.message?e.message:'unknown'))}">Play</button>
  <button onclick="clickCount('Pause'); updateDiag('paused BEFORE='+v.paused); try{v.pause();}catch(e){updateDiag('pause exception: '+(e&&e.message?e.message:'unknown'))}; updateDiag('paused AFTER='+v.paused)">Pause</button>
  <button onclick="clickCount('Seek-15'); updateDiag('currentTime BEFORE='+v.currentTime.toFixed(2)); try{v.currentTime=Math.max(0,v.currentTime-15);}catch(e){updateDiag('seek- exception: '+(e&&e.message?e.message:'unknown'))}; updateDiag('currentTime AFTER='+v.currentTime.toFixed(2))">Seek -15</button>
  <button onclick="clickCount('Seek+15'); updateDiag('currentTime BEFORE='+v.currentTime.toFixed(2)); try{v.currentTime=Math.min(v.duration||0,v.currentTime+15);}catch(e){updateDiag('seek+ exception: '+(e&&e.message?e.message:'unknown'))}; updateDiag('currentTime AFTER='+v.currentTime.toFixed(2))">Seek +15</button>
  <button onclick="clickCount('Mute'); v.muted=!v.muted; updateDiag('muted='+v.muted)">Mute / Unmute</button>
  <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="1" oninput="clickCount('Volume'); v.volume=parseFloat(this.value); updateDiag('volume set='+v.volume)"></label>
</div>
<div id="clicks"></div>
<h3>Diagnostics (250ms)</h3>
<div id="diag">Loading...</div>
<h3>Event log (last 30)</h3>
<div id="eventLog"></div>
</div>
<script>
var v=document.getElementById('v');
var diag=document.getElementById('diag');
var logEl=document.getElementById('eventLog');
var clicks=document.getElementById('clicks');
var counts={Play:0,Pause:0,'Seek-15':0,'Seek+15':0,'Mute':0,'Volume':0};
var logEntries=[];
function logEvent(name,extra){var s=new Date().toISOString()+' '+name+(extra?' | '+extra:''); logEntries.push(s); if(logEntries.length>30)logEntries.shift(); logEl.textContent=logEntries.join('\n');}
function clickCount(name){counts[name]=(counts[name]||0)+1; clicks.textContent='Clicks: '+JSON.stringify(counts);}
function updateDiag(extra){
  try{
    var paused=v.paused; var ct=v.currentTime; var dur=v.duration||0; var vol=v.volume;
    var ready=v.readyState; var net=v.networkState||0; var seeking=v.seeking||false;
    var err=v.error; var errStr='none'; if(err){errStr='code='+err.code+(err.message?' msg='+err.message:'');}
    diag.textContent='paused='+paused+' currentTime='+ct.toFixed(2)+' duration='+dur.toFixed(2)+' volume='+vol.toFixed(2)+' readyState='+ready+' networkState='+net+' seeking='+seeking+' error='+errStr+(extra?' | '+extra:'');
  }catch(e){diag.textContent='diag error: '+(e&&e.message?e.message:e);}
}
['play','playing','pause','seeking','seeked','waiting','stalled','error','timeupdate'].forEach(function(evt){
  v.addEventListener(evt,function(e){
    logEvent(evt,'target='+e.target.tagName+(e.currentTime!==undefined?' time='+e.currentTime.toFixed(2):'')+(e.error?' err='+e.error.code:''));
    updateDiag('event='+evt);
  });
});
v.addEventListener('error',function(e){ logEvent('error', 'code='+((v.error&&v.error.code)?v.error.code:'?')+(v.error&&v.error.message?' msg='+v.error.message:'')); });
setInterval(updateDiag,250);
updateDiag();
</script>
</body>
</html>
