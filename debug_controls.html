<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Debug Controls</title></head>
<body style="margin:0;padding:8px;font-family:sans-serif">
<h3>Video Control Debug</h3>
<video id="v" width="640" height="360" controls style="background:#333;border:1px solid #ccc;display:block;">
<source src="C:\\Users\\felix\\Videos\\lit.mkv" type="video/x-matroska">
</video>
<table border="1" cellpadding="4"><tr><th>Metric</th><th>Value</th></tr>
<tr><td>click</td><td id="click">-</td></tr>
<tr><td>pointerdown</td><td id="pd">-</td></tr>
<tr><td>mousedown</td><td id="md">-</td></tr>
<tr><td>video.paused</td><td id="paused">-</td></tr>
<tr><td>video.currentTime</td><td id="ct">-</td></tr>
<tr><td>video.volume</td><td id="vol">-</td></tr>
</table>
<script>
var v=document.getElementById('v');
function upd(){document.getElementById('paused').textContent=v.paused; document.getElementById('ct').textContent=v.currentTime.toFixed(2); document.getElementById('vol').textContent=v.volume.toFixed(2);}
['click','pointerdown','mousedown'].forEach(function(evt){v.addEventListener(evt,function(e){document.getElementById(evt).textContent='YES at '+new Date().toISOString()+' clientX='+e.clientX+' clientY='+e.clientY+' target='+e.target.tagName;upd();});});
v.addEventListener('play',function(){upd(); document.getElementById('click').textContent+=' PLAY';});
v.addEventListener('pause',function(){upd(); document.getElementById('click').textContent+=' PAUSE';});
setInterval(upd,500);
</script>
</body></html>
