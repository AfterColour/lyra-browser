<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Frame pipeline test</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,.7); padding: 10px 14px; border-radius: 8px; }
  #hud b { font-size: 22px; }
  canvas { position: absolute; left: 0; top: 0; }
  #box { position: absolute; width: 160px; height: 160px; background: #3a8; border-radius: 16px; top: 45%; left: 0; display: none; }
  #results { margin-top: 6px; white-space: pre; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">
  <div>Режим: <span id="mode">-</span> (<span id="left">-</span> с)</div>
  <div>rAF: <b id="fps">-</b> кадр/с, худший кадр <span id="worst">-</span> мс</div>
  <div id="results"></div>
</div>
<canvas id="c"></canvas>
<div id="box"></div>
<script>
// Four modes, 8 s each, in a fixed order (the timing log is matched to them by order):
//   1. idle       - requestAnimationFrame only, nothing changes on screen
//   2. canvas-sm  - 300x300 canvas redrawn every frame
//   3. canvas-full- window-sized canvas redrawn every frame
//   4. transform  - a box moved with a CSS transform (compositor only, no repaint)
const modes = ['idle', 'canvas-sm', 'canvas-full', 'transform'];
const duration = 8000;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const box = document.getElementById('box');
let modeIndex = -1, modeStart = 0, frames = 0, worst = 0, last = 0, lastReport = 0;
const results = [];

function startMode(i, now) {
  if (modeIndex >= 0)
    results.push(`${modes[modeIndex].padEnd(12)} ${(frames * 1000 / (now - modeStart)).toFixed(1).padStart(5)} кадр/с`);
  document.getElementById('results').textContent = results.join('\n');
  modeIndex = i; modeStart = now; frames = 0; worst = 0;
  if (i >= modes.length) { document.getElementById('mode').textContent = 'готово'; document.title = 'done'; return false; }
  const m = modes[i];
  document.getElementById('mode').textContent = m;
  document.title = m;
  box.style.display = m === 'transform' ? 'block' : 'none';
  if (m === 'canvas-sm') { canvas.width = 300; canvas.height = 300; canvas.style.left = '40%'; canvas.style.top = '30%'; }
  else if (m === 'canvas-full') { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px'; canvas.style.left = '0'; canvas.style.top = '0'; }
  else { canvas.width = 1; canvas.height = 1; }
  return true;
}

function draw(t) {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#222'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const a = t / 600 + i * 0.4;
    ctx.beginPath();
    ctx.strokeStyle = `hsl(${(i * 9 + t / 20) % 360},80%,60%)`;
    ctx.lineWidth = 3;
    ctx.arc(w / 2 + Math.cos(a) * w / 3, h / 2 + Math.sin(a * 1.3) * h / 3, 20 + i * 2, 0, Math.PI * 1.5);
    ctx.stroke();
  }
}

function frame(now) {
  if (modeIndex < 0) startMode(0, now);
  if (last) worst = Math.max(worst, now - last);
  last = now; frames++;
  const m = modes[modeIndex];
  if (m === 'canvas-sm' || m === 'canvas-full') draw(now);
  if (m === 'transform') box.style.transform = `translateX(${(Math.sin(now / 500) + 1) * (innerWidth - 200) / 2}px)`;
  if (now - lastReport > 500) {
    document.getElementById('fps').textContent = (frames * 1000 / Math.max(1, now - modeStart)).toFixed(1);
    document.getElementById('worst').textContent = worst.toFixed(1);
    document.getElementById('left').textContent = Math.max(0, (duration - (now - modeStart)) / 1000).toFixed(0);
    lastReport = now;
  }
  if (now - modeStart >= duration && !startMode(modeIndex + 1, now)) return;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
