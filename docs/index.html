<!doctype html>
<!--
  Lyra's website (GitHub Pages, served from this docs/ folder of the main branch). Plain HTML/CSS,
  no build step.
  - update.json: the update manifest installed copies of Lyra read; this page shows its version.
  - releases.json: every version's notes (release-notes/<v>.md, English, "---", Russian), written
    by tools/release.py with each release; "What's new" shows them. GitHub's releases are asked
    first, so a release shows here as soon as it is published.
  - shots/: Lyra's looks for the switcher, theme x tab layout x sidebar panel closed/open
    (tools: patches/set/shots3.ps1, a clean profile).
-->
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra — a calm browser for Windows</title>
<meta name="description" content="Lyra is a web browser for Windows on its own WebKit engine, with a built-in ad blocker, a sidebar and Chrome and Firefox extensions.">
<link rel="icon" href="icon.png">
<meta property="og:title" content="Lyra">
<meta property="og:description" content="A web browser for Windows on its own WebKit engine, with a built-in ad blocker, a sidebar and Chrome and Firefox extensions.">
<meta property="og:image" content="https://aftercolour.github.io/lyra-browser/shots/dark-compact-open.webp">
<style>
  :root {
    --a1: #9E80FF; --a2: #6A4CE0; --gold: #FFD68C;
    --text: #F4F2FF; --text2: rgba(236, 232, 255, .66); --text3: rgba(236, 232, 255, .44);
    --card: rgba(255, 255, 255, .05); --card2: rgba(255, 255, 255, .08); --line: rgba(255, 255, 255, .09);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html { background: #141032 linear-gradient(160deg, #141032 0%, #22174A 55%, #2C1A58 100%) fixed; color: var(--text); scroll-behavior: smooth; }
  body { margin: 0; font: 16px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; overflow-x: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #sky i { position: absolute; border-radius: 50%; background: #fff; opacity: 0; animation: tw var(--d) ease-in-out var(--w) infinite; }
  #sky i.big { box-shadow: 0 0 6px 2px rgba(255, 255, 255, .2); }
  @keyframes tw { 0%, 100% { opacity: calc(var(--a) * .35); } 50% { opacity: var(--a); } }
  .shoot { position: absolute; width: 120px; height: 1.5px; transform-origin: right center;
           background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85)); animation: shoot 1s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes shoot { 0% { opacity: 0; transform: rotate(-21deg) translateX(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: rotate(-21deg) translateX(-300px); } }
  .glow { position: absolute; left: 50%; top: 0; width: 1100px; height: 800px; margin-left: -550px;
          background: radial-gradient(closest-side, rgba(120, 90, 230, .30), transparent); pointer-events: none; }

  header, main, footer { position: relative; z-index: 1; }
  nav { max-width: 1120px; margin: 0 auto; padding: 22px 28px; display: flex; align-items: center; gap: 6px; }
  nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; margin-right: auto; }
  nav .brand img { width: 28px; height: 28px; }
  nav a.link { color: var(--text2); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 8px; transition: color .2s, background .2s; }
  nav a.link:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { font-size: 13px; color: var(--text2); background: none; border: 0; height: 30px; padding: 0 14px; white-space: nowrap; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); color: var(--text); }
  .lang { margin-left: 8px; }
  .lang button { font-size: 12px; height: 26px; padding: 0 11px; }

  .hero { position: relative; max-width: 900px; margin: 0 auto; padding: 60px 28px 30px; text-align: center; }
  .hero .icon { width: 132px; height: 132px; margin: 0 auto 28px; }
  .hero .icon img { width: 100%; height: 100%; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 20px 46px rgba(120, 90, 255, .5)); }
  @keyframes float { 50% { transform: translateY(-7px); } }
  h1 { margin: 0; font: 300 64px/1.05 "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; letter-spacing: -.02em; }
  h2 { margin: 0 0 10px; font: 300 38px/1.15 "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", sans-serif; letter-spacing: -.01em; }
  .tag { margin: 18px auto 0; max-width: 620px; font-size: 19px; color: var(--text2); }
  .cta { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dl { display: inline-flex; align-items: center; gap: 12px; height: 54px; padding: 0 34px; border-radius: 999px; color: #fff; text-decoration: none;
        font-weight: 600; font-size: 17px; background: linear-gradient(135deg, var(--a1), var(--a2));
        box-shadow: 0 14px 40px -12px rgba(110, 80, 240, .95); transition: transform .25s var(--ease), box-shadow .3s, filter .3s; }
  .dl:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 18px 48px -12px rgba(140, 110, 255, 1); }
  .dl svg { width: 20px; height: 20px; }
  .meta { color: var(--text3); font-size: 13px; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .8s var(--ease), transform 1s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }
  section { max-width: 1120px; margin: 0 auto; padding: 70px 28px 20px; }
  .head { text-align: center; margin-bottom: 30px; }
  .head p { margin: 0 auto; max-width: 620px; color: var(--text2); }

  /* looks: Lyra's own screenshots, theme x tab layout */
  .looks .controls { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 26px; }
  .frame { position: relative; max-width: 1040px; margin: 0 auto; aspect-ratio: 1662 / 1041; border-radius: 14px; overflow: hidden;
           box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 40px 90px -30px rgba(0, 0, 0, .8), 0 30px 120px -40px rgba(120, 90, 255, .55);
           background: #1b1636; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s var(--ease), transform .8s var(--ease); transform: scale(1.01); }
  .frame img.on { opacity: 1; transform: none; }
  .caption { text-align: center; margin-top: 18px; color: var(--text2); font-size: 15px; min-height: 24px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card { padding: 24px 22px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line);
          transition: transform .35s var(--ease), background .35s; }
  .card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, .075); }
  .card svg { width: 30px; height: 30px; color: var(--a1); margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .card p { margin: 0; color: var(--text2); font-size: 14.5px; }
  .card .new { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; vertical-align: 2px;
               color: #3A2A00; background: var(--gold); }

  /* what's new */
  .notes { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .rel { border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .rel > button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: none; border: 0; cursor: pointer; text-align: left; }
  .rel > button:hover { background: rgba(255, 255, 255, .03); }
  .rel .ver { font-size: 18px; font-weight: 600; }
  .rel .latest { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); }
  .rel .date { color: var(--text3); font-size: 13px; margin-left: auto; }
  .rel .chev { width: 14px; height: 14px; color: var(--text3); transition: transform .4s var(--ease); flex: none; }
  .rel.open .chev { transform: rotate(180deg); }
  .rel .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
  .rel.open .body { grid-template-rows: 1fr; }
  .rel .body > div { overflow: hidden; }
  .rel .md { padding: 0 24px 20px; color: var(--text2); font-size: 15px; }
  .md p { margin: 0 0 10px; }
  .md p.lead { color: var(--text); font-size: 16px; }
  .md ul { margin: 0; padding-left: 20px; }
  .md li { margin: 6px 0; }
  .md b { color: var(--text); font-weight: 600; }
  .md code { font: 13px Consolas, monospace; padding: 1px 5px; border-radius: 5px; background: rgba(255, 255, 255, .08); }
  .md a { color: #CBBEFF; }
  .all { text-align: center; margin-top: 18px; }
  .all a { color: var(--text2); font-size: 14px; }

  section.open { max-width: 760px; text-align: center; }
  section.open p { margin: 0 auto; color: var(--text2); max-width: 600px; }
  .links { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; text-decoration: none; font-size: 14px;
          background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: background .25s, transform .25s var(--ease); }
  .chip:hover { background: rgba(255, 255, 255, .09); transform: translateY(-2px); }

  footer { max-width: 1120px; margin: 0 auto; padding: 60px 28px 40px; color: var(--text3); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  footer a { color: var(--text2); text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } h1 { font-size: 50px; } nav a.link { display: none; } }
  @media (max-width: 560px) { .looks .seg button { padding: 0 10px; font-size: 12px; } .grid { grid-template-columns: 1fr; } h1 { font-size: 42px; } h2 { font-size: 30px; } .rel .date { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .reveal { opacity: 1; transform: none; } }
</style>
</head>

  <section id="news">

</main>

      ["key", "Пароли и ключи доступа", "Lyra хранит пароли на этом компьютере, зашифрованными для вашей учётной записи Windows, или доверяет их Bitwarden и Proton Pass. Ключи доступа впускают на сайты через Windows Hello, ключ безопасности или телефон.", true],
      ["gesture", "Жесты тачпада", "Двумя пальцами листайте назад и вперёд, щипком меняйте масштаб.", true],
      ["quiet", "Тихий с самого начала", "Встроенный блокировщик рекламы и трекеров и приватные вкладки. В настройках видно, каким сайтам вы разрешили камеру, микрофон, уведомления и местоположение."],
      ["read", "Читать, переводить, смотреть", "Режим чтения, перевод страниц, PDF прямо во вкладке и «картинка в картинке» для видео."],
      ["video", "Плавное видео", "GStreamer и аппаратное декодирование через Direct3D 11 для YouTube и остальных сайтов."],
      ["leaf", "Бережёт память", "Вкладки, на которые вы не смотрите, отдают память Windows и останавливают анимации. Свёрнутая Lyra почти не нагружает процессор.", true],
    ],
    newsTitle: "Что нового", newsText: "Заметки к каждой версии, те же, что на GitHub.",
    latest: "Последняя", allReleases: "Все версии на GitHub →", notesFail: "Заметки не загрузились. Они есть на GitHub.",
    openTitle: "Исходный код", openText: "У движка открытый исходный код. Код самой Lyra открыт для чтения: видно, что работает на вашем компьютере.",
    chipLyra: "Lyra на GitHub", chipEngine: "Движок WebKit", chipLicense: "Лицензия",
    date: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }),
  },
};
const NEW_LABEL = { en: "New", ru: "Новое" };
let lang = "en";
try { lang = localStorage.getItem("lyra.lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en"); } catch (e) {}
let manifest = null, releases = null, notesFailed = false;
const look = { theme: "dark", layout: "compact", panel: "closed" };
let lookTouched = false;
function $(id) { return document.getElementById(id); }

// ---- the looks switcher ----------------------------------------------------------------------
const frame = $("frame");
const imgs = {};
const lookKey = () => look.theme + "-" + look.layout + "-" + look.panel;
for (const th of ["dark", "light"]) for (const ly of ["compact", "row", "side"]) for (const pn of ["closed", "open"]) {
  const im = new Image();
  im.src = "shots/" + th + "-" + ly + "-" + pn + ".webp";
  im.alt = "Lyra: " + th + ", " + ly + ", sidebar panel " + pn;
  im.decoding = "async";
  frame.appendChild(im);
  imgs[th + "-" + ly + "-" + pn] = im;
}
function showLook() {
  for (const k in imgs) imgs[k].classList.toggle("on", k === lookKey());
  for (const [seg, key] of [["themeSeg", "theme"], ["layoutSeg", "layout"], ["panelSeg", "panel"]])
    document.querySelectorAll("#" + seg + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === look[key])));
  $("caption").textContent = T[lang].captions[look.layout] + (look.panel === "open" ? " " + T[lang].panelCaption : "");
}
for (const [seg, key] of [["themeSeg", "theme"], ["layoutSeg", "layout"], ["panelSeg", "panel"]])
  document.querySelectorAll("#" + seg + " button").forEach((b) => b.addEventListener("click", () => { lookTouched = true; look[key] = b.dataset.v; showLook(); }));
// Until it is touched, it goes through the looks by itself (while it is on screen): each layout,
// then the same with the sidebar's panel open.
let lookVisible = false;
const order = [["dark", "compact", "closed"], ["dark", "compact", "open"], ["dark", "row", "closed"], ["dark", "side", "closed"],
               ["dark", "side", "open"], ["light", "side", "closed"], ["light", "row", "open"], ["light", "compact", "closed"]];
let step = 0;
setInterval(() => {
  if (lookTouched || !lookVisible || document.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  step = (step + 1) % order.length;
  [look.theme, look.layout, look.panel] = order[step];
  showLook();
}, 3500);
if ("IntersectionObserver" in window) new IntersectionObserver((es) => { lookVisible = es[0].isIntersecting; }, { threshold: .4 }).observe(frame);

// ---- release notes ---------------------------------------------------------------------------
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
}
// The notes: a few lines of Markdown (paragraphs, "- " lists, **bold**, `code`, links), English
// then "---" then Russian. The download paragraph is left out: this page has its own button.
function renderNotes(md) {
  const parts = md.replace(/\r\n/g, "\n").split(/\n-{3,}\n/);
  const text = (lang === "ru" && parts[1] ? parts[1] : parts[0]).trim();
  const blocks = [];
  let cur = null;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { cur = null; continue; }
    const item = line.match(/^\s*[-*] (.*)$/);
    if (item) { cur = { type: "li", text: item[1] }; blocks.push(cur); continue; }
    if (cur) { cur.text += " " + line.trim(); continue; }
    cur = { type: "p", text: line.trim() };
    blocks.push(cur);
  }
  let html = "", inList = false, first = true;
  for (const b of blocks) {
    if (b.type === "p" && /^\*\*(Download|Скачать|Загрузка)/i.test(b.text)) continue;
    if (b.type === "li" && !inList) { html += "<ul>"; inList = true; }
    if (b.type !== "li" && inList) { html += "</ul>"; inList = false; }
    html += b.type === "li" ? "<li>" + inline(b.text) + "</li>" : '<p' + (first ? ' class="lead"' : "") + ">" + inline(b.text) + "</p>";
    first = false;
  }
  return html + (inList ? "</ul>" : "");
}
const CHEV = '<svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg>';
const openVersions = new Set();
function renderReleases() {
  const t = T[lang], box = $("notes");
  box.textContent = "";
  if (!releases) {
    if (notesFailed) { const p = document.createElement("p"); p.className = "head"; p.style.color = "var(--text3)"; p.textContent = t.notesFail; box.appendChild(p); }
    return;
  }
  releases.forEach((r, i) => {
    if (i === 0 && !openVersions.size) openVersions.add(r.version);
    const el = document.createElement("div");
    el.className = "rel reveal in" + (openVersions.has(r.version) ? " open" : "");
    const d = r.date ? new Date(r.date + "T12:00:00") : null;
    el.innerHTML = '<button type="button"><span class="ver"></span>' + (i === 0 ? '<span class="latest"></span>' : "") +
                   '<span class="date"></span>' + CHEV + '</button><div class="body"><div><div class="md"></div></div></div>';
    el.querySelector(".ver").textContent = "Lyra " + r.version;
    if (i === 0) el.querySelector(".latest").textContent = t.latest;
    el.querySelector(".date").textContent = d && !isNaN(d) ? t.date(d) : "";
    el.querySelector(".md").innerHTML = renderNotes(r.notes || "");
    el.querySelector("button").addEventListener("click", () => {
      const open = !el.classList.contains("open");
      el.classList.toggle("open", open);
      open ? openVersions.add(r.version) : openVersions.delete(r.version);
    });
    box.appendChild(el);
  });
}
// GitHub's releases first (a new one shows at once), then releases.json next to this page.
function loadReleases() {
  let cached = null;
  try { cached = JSON.parse(sessionStorage.getItem("lyra.releases") || "null"); } catch (e) {}
  if (cached) { releases = cached; renderReleases(); return; }
  const fromGitHub = fetch("https://api.github.com/repos/AfterColour/lyra-browser/releases?per_page=30", { headers: { Accept: "application/vnd.github+json" } })
    .then((r) => r.ok ? r.json() : Promise.reject(r.status))
    .then((list) => list.filter((r) => !r.draft && !r.prerelease).map((r) => ({ version: r.tag_name.replace(/^v/, ""), date: (r.published_at || "").slice(0, 10), notes: r.body || "" })));
  const fromSite = () => fetch("releases.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : Promise.reject(r.status));
  fromGitHub.catch(fromSite).then((list) => {
    if (!Array.isArray(list) || !list.length) throw new Error("empty");
    releases = list;
    try { sessionStorage.setItem("lyra.releases", JSON.stringify(list)); } catch (e) {}
    renderReleases();
  }).catch(() => { notesFailed = true; renderReleases(); });
}

// ---- the page --------------------------------------------------------------------------------
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  $("meta").textContent = manifest ? t.meta(manifest.version, Math.round(manifest.size / 1048576)) : t.metaNone;
  const grid = $("grid");
  grid.textContent = "";
  t.features.forEach(([icon, h, p, isNew], i) => {
    const c = document.createElement("div");
    c.className = "card reveal";
    c.style.transitionDelay = (i % 3) * 0.08 + "s";
    c.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICON[icon] + '</svg><h3></h3><p></p>';
    c.querySelector("h3").textContent = h;
    if (isNew) { const n = document.createElement("span"); n.className = "new"; n.textContent = NEW_LABEL[lang]; c.querySelector("h3").appendChild(n); }
    c.querySelector("p").textContent = p;
    grid.appendChild(c);
  });
  showLook();
  renderReleases();
  observe();
}
document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("lyra.lang", lang); } catch (e) {}
  render();
}));

// Things fade in as they scroll into view
const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((e) => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: .12 }) : null;
function observe() { document.querySelectorAll(".reveal:not(.in)").forEach((el) => io ? io.observe(el) : el.classList.add("in")); }

// The sky: twinkling stars and now and then a shooting star
(function () {
  const sky = $("sky"), n = Math.round(innerWidth * innerHeight / 5500);
  let html = "";
  for (let i = 0; i < n; i++) {
    const big = Math.random() < .08, r = ((big ? 1.3 : .5) + Math.random() * .8) * 2;
    html += '<i class="' + (big ? "big" : "") + '" style="left:' + (Math.random() * 100).toFixed(2) + "%;top:" + (Math.random() * 100).toFixed(2) +
            "%;width:" + r.toFixed(1) + "px;height:" + r.toFixed(1) + "px;--a:" + (.3 + Math.random() * .6).toFixed(2) + ";--d:" +
            (2.5 + Math.random() * 5).toFixed(1) + "s;--w:-" + (Math.random() * 6).toFixed(1) + 's"></i>';
  }
  sky.innerHTML = html;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  (function shoot() {
    const el = document.createElement("div");
    el.className = "shoot";
    el.style.left = (40 + Math.random() * 50) + "%";
    el.style.top = (5 + Math.random() * 25) + "%";
    sky.appendChild(el);
    setTimeout(() => el.remove(), 1200);
    setTimeout(shoot, 6000 + Math.random() * 6000);
  })();
})();

render();
loadReleases();
fetch("update.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((m) => { if (m && m.version) { manifest = m; render(); } }).catch(() => {});
</script>
</body>
</html>
